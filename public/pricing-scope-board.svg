<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Call support scope and pricing planning board</title><desc id="desc">A structured board showing tasks, schedule, systems, and review requirements flowing into a defined support scope.</desc>
