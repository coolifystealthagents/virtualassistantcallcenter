<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Call quality review board</title><desc id="desc">A structured call quality board showing greeting, record, next step, and escalation checks.</desc>
<rect width="1200" height="675" fill="#071b2f"/><g stroke="#173650"><path d="M0 96h1200M0 192h1200M0 288h1200M0 384h1200M0 480h1200M0 576h1200"/><path d="M120 0v675M240 0v675M360 0v675M480 0v675M600 0v675M720 0v675M840 0v675M960 0v675M1080 0v675"/></g>
<g font-family="Arial,sans-serif"><text x="74" y="86" fill="#f05a36" font-size="18" font-weight="700" letter-spacing="3">CALL QUALITY REVIEW</text><text x="74" y="142" fill="#fff" font-size="40" font-weight="800">Check the call path, not just the outcome.</text><text x="74" y="182" fill="#b9cbd8" font-size="18">A review record should show what happened and who owns the next step.</text></g>
<g transform="translate(74 235)" font-family="Arial,sans-serif"><rect width="1052" height="320" fill="#0d2941" stroke="#31516b"/><g transform="translate(28 28)"><rect width="224" height="264" fill="#fff"/><text x="20" y="38" fill="#071b2f" font-size="17" font-weight="800">Greeting</text><path d="M20 72h156M20 104h128M20 136h170" stroke="#b9c8d2" stroke-width="8"/><circle cx="188" cy="220" r="22" fill="#e9f6d7"/><path d="m178 220 8 8 14-18" fill="none" stroke="#4b6d27" stroke-width="6"/></g><g transform="translate(285 28)"><rect width="224" height="264" fill="#fff"/><text x="20" y="38" fill="#071b2f" font-size="17" font-weight="800">Call record</text><path d="M20 72h174M20 104h143M20 136h160" stroke="#b9c8d2" stroke-width="8"/><circle cx="188" cy="220" r="22" fill="#eaf7fb"/><path d="M176 220h24" stroke="#20758e" stroke-width="6"/></g><g transform="translate(542 28)"><rect width="224" height="264" fill="#fff"/><text x="20" y="38" fill="#071b2f" font-size="17" font-weight="800">Next step</text><path d="M20 72h145M20 104h176M20 136h132" stroke="#b9c8d2" stroke-width="8"/><circle cx="188" cy="220" r="22" fill="#fff0eb"/><path d="m178 220 8 8 14-18" fill="none" stroke="#b43f24" stroke-width="6"/></g><g transform="translate(799 28)"><rect width="224" height="264" fill="#f05a36"/><text x="20" y="38" fill="#fff" font-size="17" font-weight="800">Escalation</text><path d="M20 72h164M20 104h126M20 136h175" stroke="#fff" stroke-width="8" opacity=".75"/><circle cx="188" cy="220" r="22" fill="#fff"/><path d="M188 207v18M188 234v2" stroke="#f05a36" stroke-width="6"/></g></g>
<text x="74" y="616" fill="#dce8f0" font-family="Arial,sans-serif" font-size="16">Virtual Assistant Call Center • manager review aid</text>
</svg>