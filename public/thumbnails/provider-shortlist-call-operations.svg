<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Call-support provider evaluation board</title>
  <desc id="desc">A structured evaluation board connecting call coverage, administrative follow-through, quality review, and owner approval.</desc>
  <rect width="1200" height="630" fill="#071426"/>
  <g fill="none" stroke="#17344d" stroke-width="1"><path d="M0 90h1200M0 180h1200M0 270h1200M0 360h1200M0 450h1200M0 540h1200"/><path d="M100 0v630M200 0v630M300 0v630M400 0v630M500 0v630M600 0v630M700 0v630M800 0v630M900 0v630M1000 0v630M1100 0v630"/></g>
  <rect x="70" y="64" width="1060" height="502" rx="12" fill="#0c2138" stroke="#31516b" stroke-width="2"/>
  <g font-family="Arial, sans-serif">
