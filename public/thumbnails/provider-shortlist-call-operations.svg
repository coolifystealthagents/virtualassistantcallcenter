    <text x="136" y="355" fill="#aebfcd" font-size="14" font-weight="400">Hours</text><text x="136" y="386" fill="#aebfcd" font-size="14" font-weight="400">Call types</text><text x="136" y="417" fill="#aebfcd" font-size="14" font-weight="400">Overflow rules</text>
    <path d="M317 361h72" stroke="#66dcff" stroke-width="3"/><path d="m379 350 14 11-14 11" fill="none" stroke="#66dcff" stroke-width="3"/>
    <rect x="393" y="274" width="205" height="174" rx="8" fill="#112c45" stroke="#52708a"/>
    <circle cx="427" cy="310" r="9" fill="#66dcff"/><text x="449" y="317" fill="#fff">Follow-through</text>
    <text x="417" y="355" fill="#aebfcd" font-size="14" font-weight="400">CRM updates</text><text x="417" y="386" fill="#aebfcd" font-size="14" font-weight="400">Appointments</text><text x="417" y="417" fill="#aebfcd" font-size="14" font-weight="400">Escalations</text>
    <path d="M598 361h72" stroke="#66dcff" stroke-width="3"/><path d="m660 350 14 11-14 11" fill="none" stroke="#66dcff" stroke-width="3"/>
    <rect x="674" y="274" width="205" height="174" rx="8" fill="#112c45" stroke="#52708a"/>
    <circle cx="708" cy="310" r="9" fill="#b7f34a"/><text x="730" y="317" fill="#fff">Quality review</text>
    <text x="698" y="355" fill="#aebfcd" font-size="14" font-weight="400">Samples</text><text x="698" y="386" fill="#aebfcd" font-size="14" font-weight="400">Corrections</text><text x="698" y="417" fill="#aebfcd" font-size="14" font-weight="400">Evidence</text>
    <path d="M879 361h72" stroke="#66dcff" stroke-width="3"/><path d="m941 350 14 11-14 11" fill="none" stroke="#66dcff" stroke-width="3"/>
