    <text x="112" y="177" fill="#ffffff" font-size="42" font-weight="800">Compare the operating lane, not the logo.</text>
    <text x="112" y="215" fill="#b9c9d6" font-size="20">Verify every scope, owner, control, and commercial term directly.</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="17" font-weight="700">
